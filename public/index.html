<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>O'quvchilar reytingi</title>
  <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --accent: #2563eb;
      --text: #0f172a;
      --muted: #64748b;
      --gold: #fbbf24;
      --silver: #cbd5e1;
      --bronze: #d97706;
      --border: #e2e8f0;
      --danger: #dc2626;
      --ok: #16a34a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", "Segoe UI", Tahoma, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px 14px 40px;
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.6rem; margin-bottom: 4px; }
    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 22px;
      font-size: 0.9rem;
    }

    /* --- Yuklanish / xabar holatlari --- */
    .screen { display: none; }
    .screen.active { display: block; }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 14px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- Obuna gate --- */
    .gate-icon { font-size: 3rem; text-align: center; margin-bottom: 8px; }
    .gate-text {
      text-align: center;
      color: var(--muted);
      margin-bottom: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .channel-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .channel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .channel-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .channel-status {
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; flex-shrink: 0;
    }
    .channel-status.yes { background: var(--ok); color: #ffffff; }
    .channel-status.no { background: #e2e8f0; color: var(--muted); }
    .channel-name { font-weight: 600; font-size: 0.95rem; }
    .channel-name small { display: block; color: var(--muted); font-weight: 400; font-size: 0.78rem; }
    .btn {
      border: none;
      border-radius: 9px;
      padding: 9px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.7; }
    .btn-join { background: var(--accent); color: #fff; }
    .btn-check {
      background: var(--ok);
      color: #ffffff;
      width: 100%;
      padding: 13px;
      font-size: 1rem;
      margin-bottom: 8px;
    }
    .btn-joined { background: transparent; color: var(--ok); cursor: default; }

    .error-box {
      background: #fef2f2;
      border: 1px solid var(--danger);
      color: #b91c1c;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      font-size: 0.9rem;
      margin: 20px 0;
    }

    /* --- Umumiy elementlar --- */
    .step-hint {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 14px;
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
      margin-bottom: 12px;
    }
    .back-btn:active { opacity: 0.6; }
    .search {
      width: 100%;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 10px 14px;
      border-radius: 9px; font-size: 0.92rem; outline: none;
      margin-bottom: 10px;
    }
    .search:focus { border-color: var(--accent); }
    .stats { color: var(--muted); font-size: 0.83rem; margin-bottom: 12px; }
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    .rank-other { color: var(--muted); }

    /* --- Qadam 1: sinflar to'ri --- */
    .class-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .class-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 14px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .class-card:active { transform: scale(0.97); }
    .class-card:hover { border-color: var(--accent); }
    .class-card .class-name {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .class-card .class-count {
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* --- Qadam 2: o'quvchilar ro'yxati --- */
    .student-list { display: flex; flex-direction: column; gap: 8px; }
    .list-divider {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 8px 2px 2px;
    }
    .student-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }
    .student-row:hover { border-color: var(--accent); }
    .student-row:active { background: #f1f5f9; }
    .student-name { flex: 1; font-weight: 500; font-size: 0.95rem; }
    .student-ball { font-weight: 700; color: var(--accent); font-size: 0.95rem; }
    .chevron { color: var(--muted); font-size: 1.1rem; }

    .rank {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 50%;
      font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
      background: #f1f5f9; color: var(--muted);
    }
    .rank-1 { background: var(--gold); color: #422006; }
    .rank-2 { background: var(--silver); color: #1e293b; }
    .rank-3 { background: var(--bronze); color: #fff; }

    /* --- Qadam 3: o'quvchi profili --- */
    .profile-head {
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 18px;
      margin-bottom: 14px;
    }
    .profile-medal { font-size: 2.6rem; line-height: 1; }
    .profile-name {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 8px 0 2px;
    }
    .profile-class { color: var(--muted); font-size: 0.9rem; }
    .profile-total-ball {
      display: inline-block;
      margin-top: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      padding: 7px 18px;
      border-radius: 999px;
    }

    /* Motivatsion banner */
    .motivation {
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 14px;
      font-size: 0.95rem;
      line-height: 1.55;
      text-align: center;
    }
    .motivation.top { background: #fef9c3; color: #854d0e; border: 1px solid #fde68a; }
    .motivation.mid { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
    .motivation.low { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }

    /* Stat kartochkalari */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .stat-card .stat-label {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 6px;
    }
    .stat-card .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
    }
    .stat-card .stat-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .stat-card.wide { grid-column: 1 / -1; }

    /* Fan taqqoslash qatori */
    .subj-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      font-size: 0.92rem;
    }
    .subj-row + .subj-row { border-top: 1px solid var(--border); }
    .subj-name { font-weight: 500; }
    .subj-vals { display: flex; gap: 14px; align-items: baseline; }
    .subj-score { font-weight: 700; }
    .subj-avg { color: var(--muted); font-size: 0.82rem; }
    .subj-diff { font-size: 0.82rem; font-weight: 600; }
    .diff-up { color: var(--ok); }
    .diff-down { color: var(--danger); }
    .diff-eq { color: var(--muted); }

    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏆 O'quvchilar reytingi</h1>
    <p class="subtitle">MBSI olimpiada natijalari</p>

    <!-- 1. Yuklanish ekrani -->
    <div class="screen active" id="screen-loading">
      <div class="loading">
        <div class="spinner"></div>
        Tekshirilmoqda...
      </div>
    </div>

    <!-- 2. Obuna gate ekrani -->
    <div class="screen" id="screen-gate">
      <div class="gate-icon">🔒</div>
      <p class="gate-text">
        Farzandingiz reytingini ko'rish uchun quyidagi kanallarimizga
        obuna bo'lishingiz kerak:
      </p>
      <div class="channel-list" id="channel-list"></div>
      <button class="btn btn-check" id="btn-recheck">✅ Tekshirish</button>
    </div>

    <!-- 3. Xato ekrani -->
    <div class="screen" id="screen-error">
      <div class="error-box" id="error-message"></div>
    </div>

    <!-- 4. Qadam 1 — Sinf tanlash -->
    <div class="screen" id="screen-classes">
      <p class="step-hint">1-qadam: farzandingiz sinfini tanlang</p>
      <div class="class-grid" id="class-grid"></div>
    </div>

    <!-- 5. Qadam 2 — O'quvchi tanlash -->
    <div class="screen" id="screen-students">
      <button class="back-btn" id="back-to-classes">← Sinflar</button>
      <p class="step-hint" id="students-hint">2-qadam: o'quvchini tanlang</p>
      <input type="text" class="search" id="search" placeholder="🔍 Ism bo'yicha qidirish..." />
      <p class="stats" id="stats"></p>
      <div class="student-list" id="student-list"></div>
    </div>

    <!-- 6. Qadam 3 — O'quvchi profili -->
    <div class="screen" id="screen-profile">
      <button class="back-btn" id="back-to-students">← O'quvchilar</button>
      <div id="profile-content"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    // --- Ekran almashtirish yordamchisi ---
    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }
    function showError(msg) {
      document.getElementById("error-message").innerHTML = "❌ " + msg;
      showScreen("screen-error");
    }

    // --- Telegram WebApp ni sozlash ---
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Telegram tasdiqlash uchun initData (imzolangan satr)
    const initData = tg?.initData || "";

    // --- DEV REJIMI ---------------------------------------------------
    // URL ga ?dev=1 qo'shilsa, dizaynni brauzerda ko'rish uchun ishlaydi:
    // obuna tekshiruvi o'tkazib yuboriladi, reyting to'g'ridan-to'g'ri
    // ratings.json dan yuklanadi. Telegram ichida bu rejim hech qachon
    // yoqilmaydi (URL da ?dev=1 bo'lmaydi).
    const DEV_MODE = new URLSearchParams(location.search).get("dev") === "1";

    // ===================================================================
    //  OBUNA TEKSHIRUVI
    // ===================================================================
    async function checkSubscription() {
      showScreen("screen-loading");

      // Dev rejimi: tekshiruvsiz to'g'ridan-to'g'ri reytingga o'tamiz
      if (DEV_MODE) {
        loadRatings();
        return;
      }

      if (!initData) {
        showError(
          "Mini App ni Telegram ilovasi orqali oching." +
          "<br><br><small style='color:var(--muted)'>" +
          "Dizaynni brauzerda ko'rish uchun manzilga <b>?dev=1</b> qo'shing.</small>"
        );
        return;
      }

      try {
        const res = await fetch("/api/check-subscription", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData }),
        });
        const data = await res.json();

        if (!data.ok) {
          showError(data.error || "Tekshirishda xato yuz berdi.");
          return;
        }

        if (data.subscribed) {
          loadRatings();
        } else {
          renderGate(data.channels);
        }
      } catch (err) {
        showError("Serverga ulanib bo'lmadi. Internetni tekshiring.");
      }
    }

    // --- Obuna gate'ini chizish ---
    function renderGate(channels) {
      const list = document.getElementById("channel-list");
      list.innerHTML = channels.map(ch => `
        <div class="channel">
          <div class="channel-info">
            <div class="channel-status ${ch.subscribed ? "yes" : "no"}">
              ${ch.subscribed ? "✓" : "•"}
            </div>
            <div class="channel-name">
              ${escapeHtml(ch.title)}
              <small>@${escapeHtml(ch.username)}</small>
            </div>
          </div>
          ${ch.subscribed
            ? `<button class="btn btn-joined">Obuna ✓</button>`
            : `<button class="btn btn-join" data-url="${ch.url}">Obuna bo'lish</button>`}
        </div>
      `).join("");

      // "Obuna bo'lish" tugmalari — kanalni Telegram ichida ochish
      list.querySelectorAll(".btn-join").forEach(btn => {
        btn.addEventListener("click", () => {
          const url = btn.dataset.url;
          if (tg?.openTelegramLink) tg.openTelegramLink(url);
          else window.open(url, "_blank");
        });
      });

      showScreen("screen-gate");
    }

    // "Tekshirish" tugmasi
    document.getElementById("btn-recheck").addEventListener("click", checkSubscription);

    // ===================================================================
    //  REYTING — 3 qadamli oqim: Sinf → O'quvchi → Profil
    // ===================================================================
    let allStudents = [];   // ratings.json dagi barcha o'quvchilar
    let currentSinf = "";   // tanlangan sinf

    async function loadRatings() {
      showScreen("screen-loading");
      try {
        let ratings;

        if (DEV_MODE) {
          // Dev rejimi: API ni chetlab o'tib, faylni to'g'ridan-to'g'ri o'qiymiz
          const res = await fetch("/ratings.json");
          if (!res.ok) throw new Error("ratings.json topilmadi");
          ratings = await res.json();
        } else {
          const res = await fetch("/api/ratings", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData }),
          });
          const data = await res.json();
          if (!data.ok) {
            showError(data.error || "Reytinglarni yuklab bo'lmadi.");
            return;
          }
          ratings = data.ratings;
        }

        allStudents = ratings;
        renderClasses();
      } catch (err) {
        showError("Serverga ulanib bo'lmadi.");
      }
    }

    // --- Yordamchi: o'quvchilarni ball bo'yicha kamayuvchi tartibda saralash
    function sortByBall(list) {
      return [...list].sort((a, b) => b.ball - a.ball);
    }

    // ===== QADAM 1: Sinflar =====
    function renderClasses() {
      // Sinflarni o'quvchi soni bilan birga olamiz, nomi bo'yicha tartiblaymiz
      const sinflar = [...new Set(allStudents.map(s => s.sinf))].sort((a, b) =>
        a.localeCompare(b, "uz", { numeric: true })
      );
      const grid = document.getElementById("class-grid");

      grid.innerHTML = sinflar.map(sinf => {
        const count = allStudents.filter(s => s.sinf === sinf).length;
        return `
          <div class="class-card" data-sinf="${escapeHtml(sinf)}">
            <div class="class-name">${escapeHtml(sinf)}</div>
            <div class="class-count">${count} o'quvchi</div>
          </div>`;
      }).join("");

      grid.querySelectorAll(".class-card").forEach(card => {
        card.addEventListener("click", () => {
          currentSinf = card.dataset.sinf;
          renderStudents();
        });
      });

      showScreen("screen-classes");
    }

    // ===== QADAM 2: O'quvchilar =====
    function renderStudents() {
      document.getElementById("students-hint").textContent =
        `${currentSinf} — o'quvchini tanlang`;
      document.getElementById("search").value = "";
      drawStudentList("");
      showScreen("screen-students");
    }

    // Qidiruv bo'yicha o'quvchilar ro'yxatini chizish.
    // Faqat 1-3 o'rin medal bilan ball tartibida; qolganlar alifbo bo'yicha,
    // o'rin va ballsiz. To'liq o'rin profil sahifasida ko'rsatiladi.
    function drawStudentList(term) {
      const classStudents = sortByBall(
        allStudents.filter(s => s.sinf === currentSinf)
      );

      // Top 3 — ball bo'yicha; qolganlar — ism bo'yicha alifbo tartibida
      const topThree = classStudents.slice(0, 3);
      const rest = classStudents
        .slice(3)
        .sort((a, b) => a.ism.localeCompare(b.ism, "uz"));

      // Qidiruv: ikkala guruhdan ham filtrlaymiz
      const matches = (s) => !term || s.ism.toLowerCase().includes(term);
      const topFiltered = topThree.filter(matches);
      const restFiltered = rest.filter(matches);

      const listEl = document.getElementById("student-list");
      const statsEl = document.getElementById("stats");

      if (topFiltered.length + restFiltered.length === 0) {
        listEl.innerHTML = `<div class="empty">Hech narsa topilmadi 🤷</div>`;
        statsEl.textContent = "";
        return;
      }

      statsEl.textContent = `${classStudents.length} ta o'quvchi`;

      // 1-3 o'rin — medal/raqam bilan
      const topRow = (s, rank) => `
        <div class="student-row" data-ism="${escapeHtml(s.ism)}">
          <span class="rank rank-${rank}">${rank}</span>
          <span class="student-name">${escapeHtml(s.ism)}</span>
          <span class="chevron">›</span>
        </div>`;

      // Qolganlar — o'rinsiz, alifbo tartibida
      const plainRow = (s) => `
        <div class="student-row" data-ism="${escapeHtml(s.ism)}">
          <span class="student-name">${escapeHtml(s.ism)}</span>
          <span class="chevron">›</span>
        </div>`;

      let html = topFiltered
        .map(s => topRow(s, classStudents.indexOf(s) + 1))
        .join("");

      html += restFiltered.map(plainRow).join("");

      listEl.innerHTML = html;

      listEl.querySelectorAll(".student-row").forEach(row => {
        row.addEventListener("click", () => {
          const student = classStudents.find(s => s.ism === row.dataset.ism);
          if (student) renderProfile(student);
        });
      });
    }

    document.getElementById("search").addEventListener("input", e => {
      drawStudentList(e.target.value.toLowerCase().trim());
    });

    // ===== QADAM 3: O'quvchi profili =====

    // O'ringa qarab tabaqalangan motivatsion gaplar
    const MOTIVATION = {
      top: [
        "Ajoyib natija! Siz sinfingizning faxri va namunasisiz. Shu zaylda davom eting! 🌟",
        "Zo'r! Bunday yuqori natija mehnat va izchillik mevasidir. Tabriklaymiz! 🏆",
        "Siz cho'qqidasiz! Endi vazifa — bu darajani saqlab qolish va boshqalarga ilhom berish. 🚀",
      ],
      mid: [
        "Yaxshi natija! Yana bir oz tirishqoqlik bilan eng oldingilar qatoriga qo'shilasiz. 💪",
        "To'g'ri yo'ldasiz! Har bir kichik qadam sizni cho'qqiga yaqinlashtiradi. ⬆️",
        "Salohiyatingiz katta! Ozгina ko'proq harakat — va natija sezilarli o'sadi. ✨",
      ],
      low: [
        "Har bir kashshof bir paytlar boshlang'ich nuqtada turgan. Asosiysi — to'xtamaslik! 🌱",
        "Bugungi natija — ertangi o'sish uchun tayanch nuqta. Sizga ishonamiz! 🤝",
        "Mag'lubiyat emas, balki tajriba. Mehnat bilan har qanday cho'qqi zabt etiladi! 💡",
      ],
    };

    function pickMotivation(percentile) {
      // percentile: yuqoridan necha % ichida (kichik = yaxshi)
      let tier, cls;
      if (percentile <= 25) { tier = "top"; cls = "top"; }
      else if (percentile <= 65) { tier = "mid"; cls = "mid"; }
      else { tier = "low"; cls = "low"; }
      const arr = MOTIVATION[tier];
      return { cls, text: arr[Math.floor(Math.random() * arr.length)] };
    }

    function renderProfile(student) {
      // --- Sinf bo'yicha hisob ---
      const classList = sortByBall(allStudents.filter(s => s.sinf === student.sinf));
      const classRank = classList.indexOf(student) + 1;
      const classSize = classList.length;

      // --- Umumiy (barcha sinflar) bo'yicha hisob ---
      const allSorted = sortByBall(allStudents);
      const totalRank = allSorted.indexOf(student) + 1;
      const totalSize = allSorted.length;

      // --- Percentile: sinf ichida yuqoridan necha % ---
      const percentile = Math.round((classRank / classSize) * 100);

      // --- Fan bo'yicha sinf o'rtachasi ---
      const avg = (key) =>
        classList.reduce((sum, s) => sum + (s[key] || 0), 0) / classSize;
      const mathAvg = avg("matematika");
      const engAvg = avg("ingliz");

      // --- Medal (umumiy o'ringa qarab) ---
      const medal =
        totalRank === 1 ? "🥇" : totalRank === 2 ? "🥈" : totalRank === 3 ? "🥉" :
        classRank === 1 ? "⭐" : "🎓";

      const mot = pickMotivation(percentile);

      document.getElementById("profile-content").innerHTML = `
        <div class="profile-head">
          <div class="profile-medal">${medal}</div>
          <div class="profile-name">${escapeHtml(student.ism)}</div>
          <div class="profile-class">${escapeHtml(student.sinf)}</div>
          <div class="profile-total-ball">${student.ball} ball</div>
        </div>

        <div class="motivation ${mot.cls}">${mot.text}</div>

        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">Sinfdagi o'rin</div>
            <div class="stat-value">${classRank}<span style="font-size:0.9rem;color:var(--muted)"> / ${classSize}</span></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Umumiy o'rin</div>
            <div class="stat-value">${totalRank}<span style="font-size:0.9rem;color:var(--muted)"> / ${totalSize}</span></div>
          </div>
          <div class="stat-card wide">
            <div class="stat-label">Yuqori foiz</div>
            <div class="stat-value">${percentileText(percentile)}</div>
            <div class="stat-sub">sinf reytingida yuqoridan ${percentile}% ichida</div>
          </div>
        </div>

        <div class="stat-card" style="margin-bottom:14px">
          <div class="section-title">Fanlar bo'yicha (sinf o'rtachasi bilan)</div>
          ${subjectRow("Matematika", student.matematika, mathAvg)}
          ${subjectRow("Ingliz tili", student.ingliz, engAvg)}
        </div>
      `;

      showScreen("screen-profile");
      window.scrollTo(0, 0);
    }

    // "Eng yaxshi 10%" kabi matn
    function percentileText(p) {
      if (p <= 5) return "Eng yaxshi 5%";
      if (p <= 10) return "Eng yaxshi 10%";
      if (p <= 25) return "Eng yaxshi 25%";
      if (p <= 50) return "Yuqori 50%";
      return "Quyi 50%";
    }

    // Bitta fan qatori: ball + sinf o'rtachasi + farq
    function subjectRow(name, score, average) {
      const avg = average.toFixed(1);
      const diff = score - average;
      let diffCls, diffText;
      if (diff > 0.05) { diffCls = "diff-up"; diffText = `▲ +${diff.toFixed(1)}`; }
      else if (diff < -0.05) { diffCls = "diff-down"; diffText = `▼ ${diff.toFixed(1)}`; }
      else { diffCls = "diff-eq"; diffText = "= o'rtacha"; }

      return `
        <div class="subj-row">
          <span class="subj-name">${name}</span>
          <span class="subj-vals">
            <span class="subj-score">${score}</span>
            <span class="subj-avg">o'rtacha ${avg}</span>
            <span class="subj-diff ${diffCls}">${diffText}</span>
          </span>
        </div>`;
    }

    // --- Orqaga qaytish tugmalari ---
    document.getElementById("back-to-classes").addEventListener("click", () => {
      showScreen("screen-classes");
    });
    document.getElementById("back-to-students").addEventListener("click", () => {
      showScreen("screen-students");
    });

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = String(text ?? "");
      return div.innerHTML;
    }

    // --- Ishni boshlash ---
    checkSubscription();
  </script>
</body>
</html>
