<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>O'quvchilar reytingi</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --gold: #fbbf24;
      --silver: #cbd5e1;
      --bronze: #d97706;
      --border: #334155;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 4px;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    /* Boshqaruv paneli */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s;
    }
    .tab:hover { border-color: var(--accent); }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .search {
      flex: 1;
      min-width: 200px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    .search:focus { border-color: var(--accent); }

    .stats {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    /* Jadval */
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
    }
    thead th {
      background: #15203a;
      padding: 12px 10px;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-align: center;
    }
    thead th:nth-child(2) { text-align: left; }
    tbody td {
      padding: 11px 10px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.95rem;
    }
    tbody td:nth-child(2) { text-align: left; font-weight: 500; }
    tbody tr:hover { background: #25344f; }

    .rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px; height: 30px;
      border-radius: 50%;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .rank-1 { background: var(--gold); color: #422006; }
    .rank-2 { background: var(--silver); color: #1e293b; }
    .rank-3 { background: var(--bronze); color: #fff; }
    .rank-other { color: var(--muted); }

    .ball {
      font-weight: 700;
      color: var(--accent);
    }
    .empty {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
    @media (max-width: 560px) {
      thead th, tbody td { padding: 8px 5px; font-size: 0.8rem; }
      .col-hide { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏆 O'quvchilar reytingi</h1>
    <p class="subtitle">MBSI olimpiada natijalari</p>

    <div class="controls">
      <div class="tabs" id="tabs"></div>
      <input type="text" class="search" id="search" placeholder="🔍 Ism bo'yicha qidirish..." />
    </div>

    <p class="stats" id="stats"></p>

    <table>
      <thead>
        <tr>
          <th>O'rin</th>
          <th>Ism Familiya</th>
          <th class="col-hide">Matematika</th>
          <th class="col-hide">Ingliz tili</th>
          <th>Ball</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    let allStudents = [];
    let currentSinf = "Barchasi";
    let searchTerm = "";

    // Ma'lumotlarni ratings.json dan yuklash
    async function loadData() {
      try {
        const res = await fetch("ratings.json");
        if (!res.ok) throw new Error("Fayl topilmadi");
        allStudents = await res.json();
        initTabs();
        render();
      } catch (err) {
        document.getElementById("tbody").innerHTML =
          `<tr><td colspan="5" class="empty">❌ ratings.json yuklanmadi.<br>
           Sahifani local server orqali oching (masalan Live Server).</td></tr>`;
      }
    }

    // Sinflar bo'yicha tab tugmalarini yaratish
    function initTabs() {
      const sinflar = ["Barchasi", ...new Set(allStudents.map(s => s.sinf))];
      const tabsEl = document.getElementById("tabs");
      tabsEl.innerHTML = sinflar
        .map(s => `<button class="tab${s === currentSinf ? " active" : ""}" data-sinf="${s}">${s}</button>`)
        .join("");
      tabsEl.querySelectorAll(".tab").forEach(btn => {
        btn.addEventListener("click", () => {
          currentSinf = btn.dataset.sinf;
          tabsEl.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          render();
        });
      });
    }

    // Qidiruv inputini kuzatish
    document.getElementById("search").addEventListener("input", e => {
      searchTerm = e.target.value.toLowerCase().trim();
      render();
    });

    // Jadvalni chizish
    function render() {
      let list = allStudents;

      // Sinf bo'yicha filtr
      if (currentSinf !== "Barchasi") {
        list = list.filter(s => s.sinf === currentSinf);
      }
      // Qidiruv bo'yicha filtr
      if (searchTerm) {
        list = list.filter(s => s.ism.toLowerCase().includes(searchTerm));
      }
      // Ball bo'yicha kamayish tartibida saralash
      list = [...list].sort((a, b) => b.ball - a.ball);

      const tbody = document.getElementById("tbody");
      const stats = document.getElementById("stats");

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty">Hech narsa topilmadi 🤷</td></tr>`;
        stats.textContent = "";
        return;
      }

      stats.textContent = `${list.length} ta o'quvchi ko'rsatilmoqda`;

      tbody.innerHTML = list
        .map((s, i) => {
          const rank = i + 1;
          const rankClass = rank <= 3 ? `rank-${rank}` : "rank-other";
          const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : "";
          return `
            <tr>
              <td><span class="rank ${rankClass}">${rank}</span></td>
              <td>${medal} ${escapeHtml(s.ism)}
                  <span style="color:var(--muted);font-size:0.8rem">· ${s.sinf}</span></td>
              <td class="col-hide">${s.matematika}</td>
              <td class="col-hide">${s.ingliz}</td>
              <td class="ball">${s.ball}</td>
            </tr>`;
        })
        .join("");
    }

    // XSS dan himoya uchun matnni tozalash
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    loadData();
  </script>
</body>
</html>
